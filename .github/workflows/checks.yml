name: Work-package engineering checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      base:
        description: Actual trusted target commit SHA
        required: true
      head:
        description: Actual candidate commit SHA
        required: true
      branch:
        description: Actual candidate branch
        required: true
      packages:
        description: Declared work packages (comma separated)
        required: true
      issues:
        description: Corresponding Issue numbers (comma separated)
        required: true
      integration:
        description: Registered integration name (only for cross-package PR)
        required: false
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete PR with actual target governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA" || { echo 'Actual target SHA is required'; exit 1; }
          for path in scripts/check_scope.py scripts/work_package_scopes.json; do
            git cat-file -e "$BASE_SHA:$path" 2>/dev/null || {
              echo "Trusted target is missing $path; establish the independently reviewed governance baseline"
              exit 1
            }
          done
          git show "$BASE_SHA:scripts/check_scope.py" > "$RUNNER_TEMP/workhunter-trusted-scope.py"
          python "$RUNNER_TEMP/workhunter-trusted-scope.py" --event-file "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/*.mjs
      - run: node scripts/build_site.mjs
      - run: node --check dist/server/index.js
      - name: Reject runtime artifacts in tracked source
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          forbidden = [p for p in files if p.startswith(('.runtime/','data/','private-reports/')) or p.endswith(('.db','.sqlite','.sqlite3','.pem','.key'))]
          assert not forbidden, forbidden
          PY
