<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="学校官方招聘公告与活动发现。" />
  <meta name="workhunter-frontend-commit" content="__FRONTEND_COMMIT__" />
  <title>学校招聘发现 · Workhunter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23143130'/%3E%3Cpath d='m10 14 6 20 8-13 8 13 6-20' fill='none' stroke='%23bce6cf' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/frontend/styles/app.css" />
  <script type="module" src="/frontend/pages/app.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="/" aria-label="Workhunter 招聘发现首页"><span class="brand-mark" aria-hidden="true">w<span></span></span><span>Workhunter<span class="brand-version">v2</span></span></a>
    <nav aria-label="主要导航"><a class="nav-link is-current" href="/" aria-current="page">招聘发现</a><a class="nav-link" href="/sources">来源状态</a><a class="nav-link" href="/review">本次核验</a></nav>
    <span class="preview-tag">学校公告与活动</span>
  </div></header>
  <main id="main" class="page-shell">
    <section class="intro" aria-labelledby="page-title"><p class="eyebrow">学校官方公告 · 电气 / 自动化</p><h1 id="page-title">找到机会，<br class="mobile-break" />从学校公告开始。</h1><p class="intro-copy">看清时间、会场与工作地，再到官方原文继续了解。</p></section>
    <section class="filter-panel" aria-labelledby="filter-title">
      <div class="section-heading"><h2 id="filter-title">招聘发现</h2><p id="catalog-status" class="section-status" role="status">正在读取学校目录…</p></div>
      <form id="search-form" hidden>
        <fieldset><legend class="sr-only">学校、校区与招聘条件</legend>
          <div class="primary-filters">
            <label class="field school-field">学校<select id="school-select" name="school_key"><option value="">正在读取学校目录…</option></select></label>
            <label class="field">校区<select id="campus-select" name="campus_id"><option value="">全部校区</option></select></label>
            <label class="field">招聘类型<select name="kind"><option value="">全部类型</option><option value="campus_talk">线下宣讲会</option><option value="job_fair">双选会 / 招聘会</option><option value="online_recruitment">线上招聘</option><option value="announcement">招聘公告</option></select></label>
            <label class="field keyword-field">关键词<input type="search" name="keyword" placeholder="公告标题或关键词" /></label>
            <button class="button button-primary search-button" type="submit">搜索</button>
          </div>
          <div class="secondary-filters"><label class="field date-field">起始日期<input type="date" name="date_from" /></label><span class="date-separator" aria-hidden="true">—</span><label class="field date-field">结束日期<input type="date" name="date_to" /></label><button class="reset-button" type="reset">清空条件</button></div>
        </fieldset>
      </form>
    </section>
    <section class="opportunities-section" aria-labelledby="opportunities-title">
      <div class="section-heading opportunity-heading"><div><h2 id="opportunities-title">招聘公告与活动</h2><p id="result-scope" class="section-copy">近期 · 电气相关与相关性未知</p></div><button class="button button-plain" id="reload-button" type="button">重新加载</button></div>
      <div id="query-navigation" class="result-navigation" hidden><div class="view-tabs" role="group" aria-label="日期视图"><button class="view-tab is-active" type="button" data-view="recent" aria-pressed="true">近期</button><button class="view-tab" type="button" data-view="upcoming" aria-pressed="false">临近活动</button><button class="view-tab" type="button" data-view="history" aria-pressed="false">历史</button><button class="view-tab" type="button" data-view="undated" aria-pressed="false">日期未知</button></div><button id="scope-toggle" class="scope-button" type="button" aria-pressed="false">全部招聘</button></div>
      <p id="result-count" class="section-copy" role="status"></p>
      <div id="opportunity-status" class="data-state is-loading" role="status" aria-live="polite"><span class="state-illustration" aria-hidden="true"><span class="paper-line"></span><span class="paper-line"></span><span class="paper-line short"></span></span><h3>正在读取招聘…</h3><p>读取完成后显示当前结果。</p></div>
      <div id="result-list" class="result-list" aria-label="招聘结果"></div>
      <nav id="pagination" class="pagination" aria-label="招聘结果分页" hidden><button id="previous-page" class="button button-plain" type="button">上一页</button><span id="page-label" role="status"></span><button id="next-page" class="button button-plain" type="button">下一页</button></nav>
    </section>
</main>
  <footer class="site-footer"><span>Workhunter v2 · 学校官方招聘发现</span><span>验收环境 · 尚未正式发布</span></footer>
  <noscript><p class="noscript-message">请启用 JavaScript 后刷新以读取当前数据。此提示不代表服务可用或已有招聘。</p></noscript>
</body>
</html>
